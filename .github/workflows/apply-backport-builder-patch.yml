name: Apply backport builder patch

on:
  push:
    branches:
      - dev/backport-builder
    paths:
      - .github/workflows/apply-backport-builder-patch.yml
      - .codex/backport-builder.patch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/backport-builder
      - name: Apply patch
        run: |
          git apply .codex/backport-builder.patch
          rm -f .codex/backport-builder.patch .github/workflows/apply-backport-builder-patch.yml
      - name: Verify
        run: |
          PYTHONPYCACHEPREFIX=/tmp/fpkg-webui-pycache python3 -m py_compile app/server.py
          TMPDIR=/tmp PYTHONPYCACHEPREFIX=/tmp/fpkg-webui-pycache python3 tests/test_basic.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/server.py app/index.html docs/ANLEITUNG.md .codex/backport-builder.patch .github/workflows/apply-backport-builder-patch.yml
          git commit -m "Add separate backport package mode"
          git push
